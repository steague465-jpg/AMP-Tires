name: Competitor prices

on:
  workflow_dispatch:
    inputs:
      brand:
        description: "Brand to scrape"
        type: choice
        options: [amp, nitto]
        default: amp
      zip:
        description: "Zip code for shipping quotes"
        default: "60563"
      mode:
        description: "shopapp-only = shop.app prices only (fast). full = also store sites + shipping (slow)"
        type: choice
        options: [shopapp-only, full]
        default: shopapp-only
      ship_top:
        description: "Check shipping on N cheapest per size (0 = all)"
        default: "5"
  # Uncomment to run automatically every Monday at 7am Eastern:
  # schedule:
  #   - cron: "0 11 * * 1"

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONUNBUFFERED: "1"
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run scraper
        run: |
          python -u amp_price_scraper.py \
            --brand "${{ github.event.inputs.brand || 'amp' }}" \
            --zip "${{ github.event.inputs.zip || '60563' }}" \
            --ship-top "${{ github.event.inputs.ship_top || '5' }}" \
            ${{ (github.event.inputs.mode || 'shopapp-only') == 'shopapp-only' && '--shopapp-only' || '' }}

      - name: Upload spreadsheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.brand || 'amp' }}-prices
          path: |
            *_prices*.xlsx
            *_prices*.csv
            store_domains.csv
            *_cache/
          if-no-files-found: warn

      - name: Save results to the results branch
        if: always()
        run: |
          B="${{ github.event.inputs.brand || 'amp' }}"
          mkdir -p /tmp/out && cp -r ${B}_cache /tmp/out/ 2>/dev/null || true
          cp ${B}_prices*.xlsx ${B}_prices*.csv /tmp/out/ 2>/dev/null || true
          git config user.name "github-actions" && git config user.email "actions@github.com"
          for attempt in 1 2 3 4 5; do
            if git fetch origin results 2>/dev/null; then git checkout -q -B results origin/results; else git checkout -q --orphan results; fi
            git rm -rf -q --cached . >/dev/null 2>&1 || true
            find . -mindepth 1 -maxdepth 1 ! -name .git ! -name "$B" -exec rm -rf {} +
            git checkout -q origin/results -- . 2>/dev/null || true
            rm -rf "$B" && mkdir -p "$B" && cp -r /tmp/out/. "$B"/
            git add -A && git commit -q -m "$B results $(date -u +%F-%H%M)" || { echo "nothing to save"; break; }
            git push -q origin results && { echo "saved"; break; }
            echo "push raced, retrying"; sleep $((attempt*7))
          done
